<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBVAP Operator Dashboard</title>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- Tailwind CSS (CDN for Hackathon) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    
    
    <link rel="icon" href="data:,">
</head>
<body class="p-6">

    <!-- Top Header -->
    <header class="glass-panel p-4 mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold tracking-wider text-blue-400">IBVAP</h1>
            <p class="text-xs text-gray-400 uppercase tracking-widest">Intelligent Border Video Analytics</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="h-3 w-3 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-sm">System Online</span>
        </div>
    </header>

    <!-- Critical Alert Banner -->
    <div id="criticalBanner" class="critical-banner p-4 mb-6 rounded-lg text-center shadow-lg shadow-red-500/20">
        <h2 class="text-2xl font-bold uppercase tracking-widest animate-pulse">⚠️ HIGH-RISK MOVEMENT DETECTED ⚠️</h2>
        <p class="text-sm mt-1">Immediate Verification Required</p>
    </div>

    <!-- Main Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Camera Feed Section -->
        <div class="glass-panel p-4 lg:col-span-2 flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h3 class="text-lg font-semibold">Live Camera Feed (Zone Alpha)</h3>
                <div class="space-x-3">
                    <button id="clearZoneBtn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm transition">Clear All</button>
                
                    <button id="lockZoneBtn" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded text-sm transition">Lock Zone</button>
                    <button id="setZoneBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-sm transition shadow-lg shadow-blue-500/30">Deploy Zones to AI</button>
                    <button id="cameraToggleBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-sm transition shadow-lg">Switch to Phone CCTV</button>
                </div>
            </div>
            
            <!-- Video & Canvas Container -->
            <div class="aspect-video bg-black rounded-lg border border-gray-700 relative overflow-hidden flex items-center justify-center">
                <!-- Live Video Feed Image -->
                <img id="videoFeed" class="w-full h-full object-contain absolute inset-0 pointer-events-none" src="" alt="Awaiting Video Stream..." />
                
                <!-- Interactive HTML5 Canvas (Resolution matched to Python stream 640x480) -->
                <canvas id="zoneCanvas" width="640" height="480" class="absolute inset-0 z-10 cursor-crosshair object-contain w-full h-full"></canvas>
            </div>
        </div>

        <!-- Incident Timeline Section -->
        <div class="glass-panel p-4 flex flex-col h-[600px]">
            <h3 class="text-lg font-semibold mb-4 border-b border-gray-700 pb-2 flex justify-between">
                <span>Incident Timeline</span>
                <span id="alertCount" class="bg-red-500 text-white text-xs px-2 py-1 rounded-full">0</span>
            </h3>
            
            <div id="alertsContainer" class="flex-1 overflow-y-auto pr-2 space-y-3 scrollbar-thin">
                <button id="clearHistoryBtn" class="bg-red-600 hover:bg-red-500 text-white text-xs px-2 py-1 rounded transition">
                    Clear History
                </button>
                <p id="noAlerts" class="text-gray-500 text-sm text-center mt-4">Monitoring for suspicious activity...</p>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
